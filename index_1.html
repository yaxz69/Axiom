<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10b981">
<title>Math Boost 5–11</title>
<style>
:root{--g:#10b981;--gd:#047857;--bg:#f8fafc;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--soft:#ecfdf5;--okb:#ecfdf5;--okl:#a7f3d0;--okt:#065f46;--badb:#fef2f2;--badl:#fecaca;--badt:#991b1b;--chip:#f1f5f9;--gold:#f59e0b;color-scheme:light}
[data-theme=dark]{--gd:#34d399;--bg:#0b1220;--card:#121c31;--ink:#e6edf7;--mut:#94a3b8;--line:#24314b;--soft:#0e2a24;--okb:#0c2b22;--okl:#14532d;--okt:#86efac;--badb:#33141a;--badl:#7f1d1d;--badt:#fca5a5;--chip:#1b2740;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:88px}
button,select,input{color:inherit;font-size:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:flex;align-items:center;gap:9px;border:0;background:none;text-align:left}
.li{width:40px;height:40px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800}
.logo h1{font-size:16px}.logo p{font-size:9px;color:var(--gd);font-weight:800;letter-spacing:1px}
.hr{display:flex;align-items:center;gap:6px}
.hb,.hr select{border:1px solid var(--line);border-radius:9px;padding:7px 8px;background:var(--card);font-weight:700;font-size:13px}
.pill{font-size:12px;font-weight:700;color:#a16207;background:#fffbeb;border:1px solid #fde68a;padding:7px 9px;border-radius:20px;white-space:nowrap}
[data-theme=dark] .pill{background:#2a2110;border-color:#5b4513;color:#fcd34d}
main{width:min(100%,520px);margin:auto;padding:20px 16px}
.h2{font-size:22px;font-weight:800;margin-bottom:4px}.sub{font-size:14px;color:var(--mut);margin-bottom:16px}
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px}
.panel{padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cls{padding:15px;text-align:left}.cls:active,.day:active{transform:scale(.98)}
.badge{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--gd);display:grid;place-items:center;font-weight:800;margin-bottom:8px}
.cn{font-weight:800;font-size:15px}.s2{font-size:11px;color:var(--mut);margin-top:3px}
.pb{height:6px;border-radius:6px;background:var(--chip);margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;background:var(--g);transition:width .3s}
.back{border:0;background:var(--soft);color:var(--gd);padding:9px 13px;border-radius:9px;font-weight:700;margin-bottom:16px}
.day{width:100%;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;text-align:left}
.tag{font-size:10px;text-transform:uppercase;font-weight:800;color:var(--gd)}.ttl{font-size:14px;font-weight:700;margin-top:3px}
.mark{min-width:36px;height:36px;border-radius:10px;background:var(--chip);display:grid;place-items:center;color:var(--mut);font-size:12px;font-weight:800}.mark.done{background:var(--okl);color:var(--okt)}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:-2px 0 12px}
.lvl{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lvl b{font-size:15px}.lvl i{font-style:normal;font-size:10px;color:var(--mut);letter-spacing:-1px}.lvl.done{border-color:var(--g)}.lvl.done i{color:var(--gold)}.lvl.lock{opacity:.5}
.lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.subj{background:var(--okl);color:var(--okt);padding:4px 8px;border-radius:6px;font-size:10px;font-weight:800;text-transform:uppercase}
.dl{font-size:11px;color:var(--mut)}.lt{font-size:19px;margin-bottom:8px}
.th{border-top:1px solid var(--line);padding-top:10px;font-size:14px;line-height:1.6;color:var(--mut)}
.ex{margin-top:12px;padding:12px;border-radius:12px;background:var(--soft);font-size:14px;line-height:1.6}.ex b{color:var(--gd)}
.qh{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);font-weight:700;margin-bottom:6px}
.qq{font-size:17px;font-weight:700;margin:14px 0 6px;line-height:1.5}
.opt{display:block;width:100%;padding:13px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;margin:8px 0;font-size:15px;font-weight:600}
.opt:disabled{opacity:.7;cursor:default}.opt.ok{border-color:var(--g);background:var(--okb);opacity:1}.opt.no{border-color:#ef4444;background:var(--badb)}
.fb{display:none;padding:11px;border-radius:10px;font-size:13px;font-weight:600;margin-top:10px}.fb.show{display:block}
.fb.ok{background:var(--okb);color:var(--okt);border:1px solid var(--okl)}.fb.no{background:var(--badb);color:var(--badt);border:1px solid var(--badl)}
.btn{width:100%;border:0;border-radius:11px;background:var(--g);color:#fff;padding:13px;font-size:14px;font-weight:800;margin-top:10px}
.btn2{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--card);padding:12px;font-weight:700;margin-top:8px}
.res{text-align:center}.stars{font-size:44px;color:var(--gold);letter-spacing:4px;animation:pop .5s}.res h3{font-size:20px;margin:6px 0}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.inp{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin:8px 0;background:var(--card)}
.disp{font-size:22px;text-align:right}.prev{min-height:24px;text-align:right;color:var(--mut);font-size:16px;margin-bottom:8px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{padding:14px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px;font-weight:700}
.keys .op{background:var(--soft);color:var(--gd)}.keys .eq{background:var(--g);color:#fff;border-color:var(--g)}.keys .cl{background:var(--badb);color:var(--badt)}
.hi{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}.hi b{color:var(--gd)}
.lvc{display:flex;align-items:center;gap:14px}.big{font-size:42px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.stat strong{font-size:24px;display:block;color:var(--gd)}.stat span{font-size:12px;color:var(--mut)}
.bg3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;background:var(--card)}.bd .e{font-size:28px}.bd b{display:block;font-size:11px;margin-top:4px}.bd span{font-size:10px;color:var(--mut);display:block;margin-top:2px}
.bd.off{opacity:.45;filter:grayscale(1)}.bd.on{border-color:var(--gold);background:linear-gradient(var(--card),var(--soft))}
.empty{padding:14px;border:1px dashed var(--line);border-radius:14px;color:var(--mut);font-size:13px;line-height:1.5}
.hide{display:none!important}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.ni{border:0;background:none;color:var(--mut);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:75px}.ni span:first-child{font-size:20px}.ni.on{color:var(--gd)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#0f172a;color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:.3s;z-index:20;pointer-events:none;max-width:90%}
#toast.show{opacity:1;transform:translate(-50%,0)}
label{font-weight:700;font-size:14px}
</style>
</head>
<body>
<header>
 <button class="logo" onclick="go('classes')"><div class="li">√x</div><div><h1>Math Boost</h1><p>5–11</p></div></button>
 <div class="hr">
  <span class="pill" id="pill"></span>
  <select id="hl" onchange="setLang(this.value)"><option value="ru">RU</option><option value="kk">ҚАЗ</option><option value="en">EN</option></select>
  <button class="hb" id="tb" onclick="toggleTheme()"></button>
  <button class="hb" onclick="go('settings')">⚙</button>
 </div>
</header>
<main>
 <section id="p-classes"><h2 class="h2" data-i="choose"></h2><p class="sub" data-i="sub"></p><div class="grid" id="cg"></div></section>
 <section id="p-days" class="hide"><button class="back" data-i="all" onclick="go('classes')"></button><h2 class="h2" id="ct"></h2><p class="sub" data-i="week"></p><div id="dl"></div></section>
 <section id="p-lesson" class="hide">
  <button class="back" data-i="back" onclick="days()"></button>
  <article class="panel">
   <div class="lh"><span class="subj" data-i="subj"></span><span class="dl" id="ld"></span></div>
   <h2 class="lt" id="lt"></h2><div class="th" id="th"></div><div class="ex" id="ex"></div>
  </article>
  <article class="panel" id="quiz">
   <div class="qh"><span id="qn"></span><span id="qx"></span></div><div class="pb"><i id="bar"></i></div>
   <p class="qq" id="qq"></p><div id="qo"></div><div class="fb" id="fb"></div>
   <button class="btn hide" id="nx" onclick="nextQ()"></button>
  </article>
  <article class="panel res hide" id="res"></article>
 </section>
 <section id="p-solver" class="hide">
  <h2 class="h2" data-i="calcT"></h2><p class="sub" data-i="calcS"></p>
  <div class="panel">
   <input id="ci" class="inp disp" inputmode="none" autocomplete="off" oninput="preview()" onkeydown="if(event.key==='Enter'){event.preventDefault();press('=')}">
   <div class="prev" id="cp"></div>
   <div class="keys" id="keys"></div>
  </div>
  <div class="panel hide" id="hp"><div class="lh"><b data-i="hist"></b><button class="back" style="margin:0;padding:6px 10px" data-i="clr" onclick="hist=[];renderHist()"></button></div><div id="hl2"></div></div>
 </section>
 <section id="p-awards" class="hide">
  <h2 class="h2" data-i="awT"></h2><p class="sub" data-i="awS"></p>
  <div class="panel"><div class="lvc"><div class="big" id="rk"></div><div style="flex:1"><b id="lv"></b><div class="s2" id="xpt"></div><div class="pb"><i id="xpb"></i></div></div></div></div>
  <div class="sg">
   <div class="stat"><strong id="s1"></strong><span data-i="done2"></span></div>
   <div class="stat"><strong id="s2"></strong><span data-i="prog"></span></div>
   <div class="stat"><strong id="s3"></strong><span data-i="streak"></span></div>
   <div class="stat"><strong id="s4"></strong><span data-i="stars"></span></div>
  </div>
  <div class="panel"><h3 style="margin-bottom:12px" data-i="badges"></h3><div class="bg3" id="bgs"></div></div>
  <button class="btn2" data-i="reset" onclick="resetAll()"></button>
 </section>
 <section id="p-settings" class="hide">
  <h2 class="h2" data-i="setT"></h2><p class="sub" data-i="setS"></p>
  <div class="panel">
   <label data-i="lang"></label>
   <select id="sl" class="inp" onchange="setLang(this.value)"><option value="ru">Русский</option><option value="kk">Қазақша</option><option value="en">English</option></select>
   <label data-i="pace"></label>
   <select id="sp" class="inp" onchange="setPace(this.value)"><option value="86400000" data-i="p1"></option><option value="43200000" data-i="p2"></option><option value="0" data-i="p3"></option></select>
   <label data-i="theme"></label>
   <select id="st" class="inp" onchange="setTheme(this.value)"><option value="auto" data-i="ta"></option><option value="light" data-i="tl"></option><option value="dark" data-i="td2"></option></select>
  </div>
  <div class="panel"><p id="ps" class="th" style="border:0;padding:0"></p></div>
  <p class="empty" data-i="note"></p>
  <button class="btn2" data-i="reset" onclick="resetAll()"></button>
 </section>
</main>
<nav>
 <button class="ni on" data-p="classes" onclick="go('classes')"><span>▦</span><span data-i="n1"></span></button>
 <button class="ni" data-p="solver" onclick="go('solver')"><span>＋</span><span data-i="n2"></span></button>
 <button class="ni" data-p="awards" onclick="go('awards')"><span>★</span><span data-i="n3"></span></button>
</nav>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[r(0,a.length-1)];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=r(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
let lang="ru";const L=(a,k,e)=>lang==="en"?e:lang==="kk"?k:a;

/* ===== Генераторы заданий: Q(вопрос, ответ, неверные варианты) ===== */
const Q=(q,a,w=[])=>{a=String(a);let o=[a];for(const x of w.map(String))if(!o.includes(x)&&o.length<4)o.push(x);const n=+a;
 for(let k=1;o.length<4&&isFinite(n);k++){const x=String(+(n+(k%2?k:-k)).toFixed(2));if(!o.includes(x))o.push(x)}
 o=sh(o);return{q,o,a:o.indexOf(a)}};
const fx=a=>a?`(x ${a>0?"−":"+"} ${Math.abs(a)})`:"x";
const sg=n=>n<0?"−":"+";
const TR=[[0,"0","1"],[30,"1/2","√3/2"],[45,"√2/2","√2/2"],[60,"√3/2","1/2"],[90,"1","0"]];
const RAD=[[30,"π/6"],[45,"π/4"],[60,"π/3"],[90,"π/2"],[120,"2π/3"],[135,"3π/4"],[150,"5π/6"],[180,"π"],[270,"3π/2"],[360,"2π"]];
const TRI=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29]];
const pw=(c,k)=>k===1?`${c}x`:`${c}x^${k}`;
/* s = сложность 1..10 (номер урока в дне) */
const TOP={
5:[
["Обыкновенные дроби","Дроби с одинаковым знаменателем складывают по числителям: a/c + b/c = (a+b)/c.",s=>{const d=r(4,6+s),a=r(1,d-3),b=r(1,d-1-a);return Q(`${a}/${d} + ${b}/${d}`,`${a+b}/${d}`,[`${a+b}/${d+d}`,`${a*b}/${d}`,`${a+b+1}/${d}`,`${a+b-1}/${d}`,`${a+b}/${d+1}`])}],
["Десятичные дроби","Десятичные дроби складывают и вычитают «в столбик», выравнивая запятые.",s=>{const x=r(11,99+s*10)/10,y=r(11,99)/10,m=r(0,1),v=m?x+y:Math.abs(x-y);return Q(`${m?x:Math.max(x,y)} ${m?"+":"−"} ${m?y:Math.min(x,y)}`,+v.toFixed(1),[+(v+.1).toFixed(1),+(v-.1).toFixed(1),+(v+1).toFixed(1)])}],
["Площадь и периметр","Площадь прямоугольника S = a·b, периметр P = 2(a+b).",s=>{const a=r(2,5+s),b=r(2,5+s),p=r(0,1);return Q(`${L("Прямоугольник","Тіктөртбұрыш","Rectangle")} ${a}×${b}: ${p?L("периметр","периметр","perimeter"):L("площадь","аудан","area")}`,p?2*(a+b):a*b,[p?a*b:2*(a+b),a+b,a*b+a])}],
["Проценты","1% — это одна сотая часть числа. p% от N = N·p/100.",s=>{const p=pick([5,10,20,25,50]),N=r(2,20+s)*20;return Q(`${p}% ${L("от","","of")} ${N}`,N*p/100,[N*p/10,N/p,N-N*p/100])}],
["Порядок действий","Сначала скобки, затем умножение и деление, потом сложение и вычитание.",s=>{const a=r(2,20),b=r(2,9),c=r(2,9),d=r(1,10);return Q(`${a} + ${b} × ${c} − ${d}`,a+b*c-d,[(a+b)*c-d,a+b*(c-d),a+b*c+d])}]],
6:[
["Отрицательные числа","Складывая числа с разными знаками, из большего модуля вычитают меньший и берут знак большего.",s=>{const x=r(-15-s,-1),y=r(1,15+s);return Q(`${x} + ${y}`,x+y,[-(x+y),x-y,Math.abs(x)+y])}],
["Модуль числа","Модуль — расстояние от нуля, он не бывает отрицательным: |−5| = 5.",s=>{const a=r(-20-s,-1),b=r(-20,20);return Q(`|${a}| + |${b}|`,-a+Math.abs(b),[a+b,-a-Math.abs(b),Math.abs(-a-Math.abs(b))+1])}],
["Пропорции","В пропорции a/b = c/d произведение крайних членов равно произведению средних.",s=>{const a=r(2,9),c=r(2,9),k=r(2,5+s);return Q(`x/${a} = ${c*k}/${c}`,a*k,[a*c*k,k,c*k-a])}],
["НОД и НОК","НОД — наибольший общий делитель, НОК — наименьшее общее кратное. НОК = a·b / НОД.",s=>{const g=r(2,9),a=g*r(2,6+s),b=g*r(2,6+s),d=gcd(a,b),l=a*b/d;return r(0,1)?Q(`${L("НОД","ЕҮОБ","GCD")}(${a}; ${b})`,d,[l,Math.abs(a-b)||1,d+1]):Q(`${L("НОК","ЕОК","LCM")}(${a}; ${b})`,l,[d,a*b,l+d])}],
["Линейные уравнения","Перенеси слагаемые и раздели обе части на коэффициент при x.",s=>{const x=r(-9-s,9+s),a=r(2,9),b=r(1,20);return Q(`${a}x + ${b} = ${a*x+b}`,x,[x+1,-x,x-1])}]],
7:[
["Свойства степеней","При умножении степеней с одинаковым основанием показатели складываются: xᵃ·xᵇ = xᵃ⁺ᵇ.",s=>{const a=r(2,5+s),b=r(2,5+s);return Q(`x^${a} · x^${b}`,`x^${a+b}`,[`x^${a*b}`,`x^${a+b+1}`,`x^${a+b-1}`,`x^${a+b+2}`])}],
["Смежные углы","Сумма смежных углов равна 180°.",s=>{const a=r(10,170);return Q(`${L("Смежные углы","Іргелес бұрыштар","Adjacent angles")}: ${a}° → ?`,180-a,[a,360-a,180-a+10])}],
["Квадрат суммы и разности","(a ± b)² = a² ± 2ab + b².",s=>{const k=r(2,9),m=r(0,1)?"+":"−";return Q(`(x ${m} ${k})²`,`x²${m}${2*k}x+${k*k}`,[`x²+${k*k}`,`x²${m}${k}x+${k*k}`,`x²${m}${2*k}x+${k*k+1}`])}],
["Сумма углов треугольника","Сумма углов треугольника равна 180°.",s=>{const a=r(30,80),b=r(30,80);return Q(`${a}° + ${b}° + ?  = 180°`,180-a-b,[a+b,360-a-b,180-a])}],
["Линейные уравнения","Если ax − b = 0, то x = b/a.",s=>{const a=r(2,9),x=r(1,10+s),b=a*x;return Q(`${a}x − ${b} = 0`,x,[-x,b,x+1])}]],
8:[
["Квадратные корни","√a — неотрицательное число, квадрат которого равен a.",s=>{const m=r(2,9+s),n=r(2,m);return Q(`√${m*m} − √${n*n}`,m-n,[m+n,m-n+1,m*m-n*n])}],
["Теорема Пифагора","В прямоугольном треугольнике c² = a² + b², где c — гипотенуза.",s=>{const t=pick(TRI),k=r(1,3),[a,b,c]=t.map(v=>v*k);return r(0,1)?Q(`a=${a}, b=${b} → c`,c,[a+b,c+1,a*b]):Q(`c=${c}, a=${a} → b`,b,[c-a,b+1,c+a])}],
["Дискриминант","Для x² + bx + c = 0: D = b² − 4c. D>0 — два корня, D=0 — один, D<0 — нет.",s=>{const p=r(-5,6),q=r(-5,6),b=-(p+q),c=p*q,D=b*b-4*c;return Q(`D: x² ${sg(b)} ${Math.abs(b)}x ${sg(c)} ${Math.abs(c)} = 0`,D,[b*b+4*c,b*b-c,D+2])}],

function lesson(d,n){const g=cur.g,st=S.done[key(g,d,n)]||0;if(!st&&blocked()){alert(lockMsg());return}
 Object.assign(cur,{d,n,i:0,mist:0,lock:false,bad:false});const [title,theory,gen]=TOP[g][d],s=n+1;
 const qs=[],seen=new Set();while(qs.length<5){let q,tries=0;do{q=gen(s)}while(seen.has(q.q)&&++tries<8);seen.add(q.q);qs.push(q)}cur.qs=qs;
 const e=gen(s);
 $("#ld").textContent=`${t("D")[d]} · ${t("lesson")} ${n+1}/10`;$("#lt").textContent=title;$("#th").textContent=theory;
 $("#ex").innerHTML=`<b>${t("ex")}:</b> ${e.q} = <b>${e.o[e.a]}</b>`;
 $("#quiz").classList.remove("hide");$("#res").classList.add("hide");showQ();go("lesson")}
function showQ(){const q=cur.qs[cur.i];$("#qn").textContent=`${t("q")} ${cur.i+1}/5`;$("#qx").textContent=`✖ ${cur.mist}`;$("#bar").style.width=cur.i*20+"%";
 $("#qq").textContent=q.q;const box=$("#qo");box.innerHTML="";
 q.o.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>answer(i,b);box.append(b)});
 $("#fb").className="fb";$("#nx").classList.add("hide");cur.lock=false}
function answer(i,b){if(cur.lock)return;const q=cur.qs[cur.i],fb=$("#fb");
 if(i===q.a){cur.lock=true;document.querySelectorAll("#qo .opt").forEach(x=>x.disabled=true);b.classList.add("ok");
  fb.className="fb show ok";fb.textContent=t("ok")+q.q+" = "+q.o[q.a];$("#bar").style.width=(cur.i+1)*20+"%";
  const nx=$("#nx");nx.textContent=cur.i<4?t("nx"):t("fin");nx.classList.remove("hide")}
 else{b.disabled=true;b.classList.add("no");cur.mist++;$("#qx").textContent=`✖ ${cur.mist}`;fb.className="fb show no";fb.textContent=t("no")}}
function nextQ(){if(!cur.lock)return;if(cur.i<4){cur.i++;showQ()}else finish()}
function finish(){const {g,d,n}=cur,k=key(g,d,n),prev=S.done[k]||0,stars=cur.mist===0?3:cur.mist<=2?2:1,before=earned();
 let gain=0;
 if(stars>prev){gain=(stars-prev)*15+(prev?0:10);if(!prev&&S.pace>0){const w=S.win;if(!w.start||Date.now()-w.start>=S.pace)S.win={start:Date.now(),count:0};S.win.count++}
  S.done[k]=stars;if(stars===3)S.perfect++;S.xp+=gain}
 const today=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();
 if(S.last!==today){S.streak=S.last===y?S.streak+1:1;S.last=today}
 save();header();
 const after=earned();after.forEach((v,i)=>{if(v&&!before[i])setTimeout(()=>toast(t("nb")+BADGES[i][0]+" "+BADGES[i][1+(lang==="kk"?1:lang==="en"?2:0)]),400+i*50)});
 $("#quiz").classList.add("hide");const R=$("#res");R.classList.remove("hide");
 R.innerHTML=`<div class="stars">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div><h3>${t("done")}</h3><p class="s2">${5-Math.min(5,cur.mist)}/5 · ✖ ${cur.mist}${gain?" · "+t("gain",{n:gain}):""}</p>${n<9?`<button class="btn" onclick="lesson(${d},${n+1})">${t("nl")}</button>`:""}<button class="btn2" onclick="lesson(${d},${n})">${t("again")}</button><button class="btn2" onclick="days()">${t("td")}</button>`}

/* ===== Награды ===== */
function awards(){const l=lvl(),lo=50*(l-1)**2,hi=50*l*l;$("#rk").textContent=rank();$("#lv").textContent=`${t("lvl")} ${l}`;
 $("#xpt").textContent=`${S.xp} / ${hi} XP`;$("#xpb").style.width=(S.xp-lo)/(hi-lo)*100+"%";
 $("#s1").textContent=cnt();$("#s2").textContent=Math.round(cnt()/TOTAL*100)+"%";$("#s3").textContent=S.streak;$("#s4").textContent=starsSum()+" / "+TOTAL*3;
 const i18=lang==="kk"?2:lang==="en"?3:1;
 $("#bgs").innerHTML=BADGES.map(b=>{const on=val(b)>=b[5],dk={l:"dl",s:"ds",p:"dp",x:"dx"}[b[4]];
  return `<div class="bd ${on?"on":"off"}"><div class="e">${b[0]}</div><b>${b[i18]}</b><span>${on?"✓":Math.min(val(b),b[5])+"/"+b[5]}</span><span>${t(dk,{n:b[5]})}</span></div>`}).join("")}

/* ===== Калькулятор (собственный парсер, без eval) ===== */
let hist=[];
function ev(src){const s=src.replace(/\s/g,"").replace(/×/g,"*").replace(/÷/g,"/").replace(/[−–]/g,"-").replace(/,/g,".");
 const T=s.match(/\d+\.?\d*|\.\d+|[-+*\/^()%√π]/g)||[];if(!T.length||T.join("")!==s)throw 0;let i=0;
 const pk=()=>T[i],eat=()=>T[i++],st=x=>x&&(/^[\d.]/.test(x)||"(√π".includes(x));
 const expr=()=>{let v=term();while(pk()==="+"||pk()==="-"){const o=eat(),b=term();v=o==="+"?v+b:v-b}return v};
 const term=()=>{let v=un();while(pk()==="*"||pk()==="/"||st(pk())){if(pk()==="*"){eat();v*=un()}else if(pk()==="/"){eat();const d=un();if(!d)throw 0;v/=d}else v*=un()}return v};
 const un=()=>{if(pk()==="-"){eat();return -un()}if(pk()==="+"){eat();return un()}return pow()};
 const pow=()=>{const b=post();if(pk()==="^"){eat();return b**un()}return b};
 const post=()=>{let v=prim();while(pk()==="%"){eat();v/=100}return v};
 const prim=()=>{const x=eat();if(x==="("){const v=expr();if(eat()!==")")throw 0;return v}if(x==="√")return Math.sqrt(post());if(x==="π")return Math.PI;if(x&&/^[\d.]/.test(x))return parseFloat(x);throw 0};
 const v=expr();if(i<T.length||!isFinite(v))throw 0;return +v.toFixed(10)}
const fmt=v=>v.toLocaleString(lang,{maximumFractionDigits:10,useGrouping:false});
const KEYS=["C","⌫","(",")","√","^","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","π","0",".","="];
function buildKeys(){$("#keys").innerHTML=KEYS.map(k=>`<button class="${"÷×−+".includes(k)?"op":k==="="?"eq":k==="C"?"cl":""}" onclick="press('${k}')">${k}</button>`).join("")}
function press(k){const el=$("#ci");
 if(k==="C"){el.value="";return preview()}
 if(k==="="){try{const v=ev(el.value);hist.unshift([el.value,v]);hist=hist.slice(0,8);el.value=String(v);renderHist();$("#cp").textContent=""}catch(e){$("#cp").textContent=t("bad")}return}
 let a=el.selectionStart??el.value.length,b=el.selectionEnd??el.value.length;
 if(k==="⌫"){if(a===b&&a>0)a--;el.value=el.value.slice(0,a)+el.value.slice(b);el.setSelectionRange(a,a)}
 else{el.value=el.value.slice(0,a)+k+el.value.slice(b);el.setSelectionRange(a+k.length,a+k.length)}
 preview()}
function preview(){const v=$("#ci").value;try{const x=ev(v);$("#cp").textContent=/[-+*\/^%√×÷−]/.test(v.replace(/^-/,""))?"= "+fmt(x):""}catch(e){$("#cp").textContent=""}}
function renderHist(){$("#hp").classList.toggle("hide",!hist.length);$("#hl2").innerHTML=hist.map((h,i)=>`<div class="hi" onclick="$('#ci').value='${h[1]}';preview()"><span>${h[0]}</span><b>= ${fmt(h[1])}</b></div>`).join("")}

/* ===== Настройки, тема, язык ===== */
function applyTheme(){const d=S.theme==="auto"?matchMedia("(prefers-color-scheme:dark)").matches:S.theme==="dark";
 document.documentElement.dataset.theme=d?"dark":"light";document.querySelector('meta[name=theme-color]').content=d?"#0b1220":"#10b981";header()}
function setTheme(v){S.theme=v;save();applyTheme()}
function toggleTheme(){setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");$("#st").value=S.theme}
matchMedia("(prefers-color-scheme:dark)").addEventListener?.("change",()=>S.theme==="auto"&&applyTheme());
function setPace(v){S.pace=+v;save();settings();if(page==="days")days()}
function settings(){$("#sl").value=lang;$("#sp").value=String(S.pace);$("#st").value=S.theme;
 $("#ps").textContent=S.pace===0?t("unl"):blocked()?lockMsg():t("avail",{n:PER-used()})}
function setLang(v){lang=S.lang=I[v]?v:"ru";save();applyLang();({classes,days,awards,settings}[page]||(()=>{}))();renderHist()}
function applyLang(){document.documentElement.lang=lang;$("#hl").value=lang;$("#sl").value=lang;
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));$("#ci").placeholder=t("ph")}
function resetAll(){if(confirm(t("conf"))){S={...S,done:{},xp:0,streak:0,last:"",perfect:0,win:{start:0,count:0}};save();hist=[];go("classes")}}

buildKeys();applyLang();applyTheme();go("classes");
</script>
